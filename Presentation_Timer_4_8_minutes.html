<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation Timer</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b30;color:white;font:18px Arial,sans-serif;text-align:center;transition:background .25s}main{max-width:850px;margin:auto;min-height:400px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}h2{font-size:18px;letter-spacing:2px;margin:0}.modes,.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{cursor:pointer;background:#283b5e;color:white;border:1px solid #72829e;border-radius:10px;padding:12px 16px;font-size:16px}button.active{background:white;color:#172640}.clock{font:bold clamp(85px,18vw,165px)/1.12 Arial;letter-spacing:-5px;font-variant-numeric:tabular-nums}.status{font-size:20px;font-weight:bold;min-height:24px}.bar{width:min(95%,600px);height:10px;background:#384961;border-radius:6px;overflow:hidden}.fill{height:100%;width:0;background:#70dcaa}.extra{background:#ab192c}.extra .fill{background:#ffe197}.done{background:#66091b}small{opacity:.8}.pipBody{background:#111b30;color:#fff}.pipWrap{height:100vh;width:100%;padding:8px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px}.pipTime{font:bold clamp(54px,15vw,96px)/1 Arial;letter-spacing:-3px;font-variant-numeric:tabular-nums}.pipStatus{font-size:12px;font-weight:bold}.pipControls{display:flex;gap:5px}.pipControls button{font-size:13px;padding:7px 10px}.pipBody.extra{background:#ab192c}.pipBody.done{background:#66091b}
</style></head><body><main><h2>PRESENTATION TIMER</h2><div class="modes"><button id="solo" class="active">Individual · 4 + 1 min</button><button id="pair">Pair · 8 + 2 min</button></div><div id="clock" class="clock">04:00</div><div id="status" class="status">Presentation time</div><div class="bar"><div class="fill" id="fill"></div></div><div class="controls"><button id="start">Start</button><button id="reset">Reset</button><button id="float">↗ Floating mini timer</button><button id="full">Full screen</button></div><small>Open the floating timer before starting your presentation. Drag the small window to the top-left corner.</small></main><script>
(()=>{let main=240,bonus=60,left=300,running=false,tick,last,beeped=false,pip=null;const $=id=>document.getElementById(id);const fmt=n=>{n=Math.max(0,Math.ceil(n));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0")};
function tone(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=720;g.gain.value=.07;o.start();o.stop(c.currentTime+.18);o.onended=()=>c.close()}catch(e){}}
function state(){let red=left<=bonus&&left>0,done=left<=0,display=done?0:red?left:left-bonus;return {red,done,display:fmt(display),label:done?"TIME IS UP":red?"QUESTIONS · FINISH NOW":"Presentation",button:running?"Pause":left<=0?"Restart":left<main+bonus?"Resume":"Start"}}
function draw(){let s=state();document.body.className=s.done?"done":s.red?"extra":"";$("clock").textContent=s.display;$("status").textContent=s.label;$("fill").style.width=Math.min(100,100*(main+bonus-left)/(main+bonus))+"%";$("start").textContent=s.button;if(pip&&!pip.closed){let d=pip.document;d.body.className="pipBody "+(s.done?"done":s.red?"extra":"");d.getElementById("time").textContent=s.display;d.getElementById("hint").textContent=s.label;d.getElementById("toggle").textContent=s.button;d.getElementById("kind").textContent=main===240?"Individual":"Pair"}}
function pause(){running=false;clearInterval(tick)}function reset(){pause();left=main+bonus;beeped=false;draw()}function mode(pair){main=pair?480:240;bonus=pair?120:60;$("solo").classList.toggle("active",!pair);$("pair").classList.toggle("active",pair);reset()}function start(){if(running){pause();draw();return}if(left<=0)reset();running=true;last=performance.now();tick=setInterval(()=>{let now=performance.now();left=Math.max(0,left-(now-last)/1000);last=now;if(left<=bonus&&!beeped){beeped=true;tone()}if(left<=0){pause();tone()}draw()},200);draw()}
$("solo").onclick=()=>mode(false);$("pair").onclick=()=>mode(true);$("reset").onclick=reset;$("start").onclick=start;$("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$("float").onclick=async()=>{if(!("documentPictureInPicture" in window)){alert("Floating mode requires a recent desktop Chrome or Edge. Open this timer in its own browser tab (not inside Moodle).");return}try{if(pip&&!pip.closed){pip.focus();return}pip=await documentPictureInPicture.requestWindow({width:330,height:175});let d=pip.document;d.head.innerHTML='<meta charset="utf-8"><title>Mini Timer</title>';for(let sheet of document.styleSheets){try{let css=[...sheet.cssRules].map(r=>r.cssText).join("\n");let style=d.createElement("style");style.textContent=css;d.head.append(style)}catch(e){}}d.body.innerHTML='<div class="pipWrap"><div id="kind" style="font-size:12px">Individual</div><div class="pipTime" id="time">04:00</div><div class="pipStatus" id="hint">Presentation</div><div class="pipControls"><button id="toggle">Start</button><button id="restart">Reset</button></div></div>';d.getElementById("toggle").onclick=start;d.getElementById("restart").onclick=reset;draw()}catch(e){alert("Could not open floating window. Try opening this page directly in Chrome or Edge, outside the Moodle iframe.")}};
draw()})();
</script></body></html>
