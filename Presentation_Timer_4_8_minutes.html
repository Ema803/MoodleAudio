<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presentation Timer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111b30;color:#fff;font:18px Arial,sans-serif;text-align:center;transition:background .25s}.wrap{min-height:390px;max-width:850px;margin:auto;padding:22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}h2{margin:0;font-size:19px;letter-spacing:2px}.modes,.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}button{cursor:pointer;padding:12px 20px;border-radius:12px;border:1px solid #72829e;background:#283b5e;color:white;font-size:16px;font-weight:bold}button.active{background:#fff;color:#172640}.time{font:800 clamp(85px,18vw,164px)/1.1 Arial,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-5px}.status{font-weight:bold;font-size:20px;min-height:24px}.bar{width:min(95%,600px);background:#3b4b67;border-radius:8px;height:10px;overflow:hidden}.fill{height:100%;background:#77e2b5;width:0}.extra{background:#ac172d}.extra .fill{background:#ffe18c}.done{background:#610719}.hint{font-size:13px;opacity:.8}@media(max-width:480px){.wrap{padding:15px 8px;gap:10px}button{font-size:14px;padding:10px}.time{letter-spacing:-3px}}
</style></head><body><div class="wrap"><h2>PRESENTATION TIMER</h2><div class="modes"><button id="one" class="active">Individual · 4 + 1 min</button><button id="two">Pair · 8 + 2 min</button></div><div class="time" id="clock">04:00</div><div class="status" id="status">Presentation time</div><div class="bar"><div class="fill" id="fill"></div></div><div class="controls"><button id="start">Start</button><button id="reset">Reset</button><button id="fullscreen">Full screen</button></div><div class="hint">The final minute (or two for a pair) is shown in red.</div></div>
<script>
const $=id=>document.getElementById(id);let main=240,bonus=60,left=300,run=false,tick,last,beeped=false;
function sound(){try{let c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=720;g.gain.value=.07;o.start();o.stop(c.currentTime+.2);o.onended=()=>c.close()}catch(e){}}
function display(){let red=left<=bonus&&left>0,done=left<=0,s=done?0:red?left:left-bonus;s=Math.ceil(s);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');document.body.className=done?'done':red?'extra':'';$('status').textContent=done?'TIME IS UP':red?'EXTRA TIME · FINISH NOW':'Presentation time';$('fill').style.width=Math.min(100,(main+bonus-left)/(main+bonus)*100)+'%';$('start').textContent=run?'Pause':left<=0?'Restart':left<main+bonus?'Resume':'Start'}
function pause(){run=false;clearInterval(tick)}function reset(){pause();left=main+bonus;beeped=false;display()}function mode(pair){main=pair?480:240;bonus=pair?120:60;$('one').classList.toggle('active',!pair);$('two').classList.toggle('active',pair);reset()}
$('one').onclick=()=>mode(false);$('two').onclick=()=>mode(true);$('reset').onclick=reset;$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
$('start').onclick=()=>{if(run){pause();display();return}if(left<=0)reset();run=true;last=performance.now();tick=setInterval(()=>{let now=performance.now();left=Math.max(0,left-(now-last)/1000);last=now;if(left<=bonus&&!beeped){beeped=true;sound()}if(left<=0){pause();sound()}display()},200);display()};display();
</script></body></html>
