<!doctype html><html><head><meta charset="utf-8"><title>Presentation Timer</title></head><body><h2>Presentation Timer</h2><button onclick="setMode(240,60)">Individual</button><button onclick="setMode(480,120)">Pair</button><h1 id="t">04:00</h1><p id="status">Presentation time</p><button onclick="start()">Start / Pause</button><button onclick="reset()">Reset</button><script>let base=240,extra=60,left=300,run=false,last=0,interval;function display(){let red=left<=extra,seconds=Math.max(0,Math.ceil(red?left: left-extra));document.getElementById("t").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0");document.body.style.background=red?"#a11225":"#101827";document.body.style.color="white";document.getElementById("status").textContent=left<=0?"TIME IS UP":red?"EXTRA TIME":"Presentation time"}function reset(){run=false;clearInterval(interval);left=base+extra;display()}function setMode(b,e){base=b;extra=e;reset()}function start(){if(run){run=false;clearInterval(interval);return}if(left<=0)reset();run=true;last=Date.now();interval=setInterval(()=>{let now=Date.now();left=Math.max(0,left-(now-last)/1000);last=now;display();if(left<=0){clearInterval(interval);run=false}},250)}display()</script></body></html>
