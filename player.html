<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listen to recording</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{display:grid;place-items:center}
.gem{--hi:#ded7ec;--base:#b9acd1;--edge:#9a8bad;display:grid;place-items:center;width:38px;height:38px;padding:0;background:none;border:0;border-radius:50%;cursor:pointer}
.disc{display:block;width:20px;height:20px;border-radius:50%;border:3px solid var(--base);background:linear-gradient(155deg,var(--hi),var(--base));box-shadow:0 1px 2px #263e4c2e,inset 0 1px 1px #ffffffb3,0 0 0 1px var(--edge);transition:box-shadow .16s,transform .16s;pointer-events:none}
.gem:active .disc,.gem[data-state="playing"] .disc{transform:translateY(1px);box-shadow:0 0 0 1px var(--edge),inset 0 2px 4px #3b31404d,inset 0 -1px 1px #ffffff99}
.gem:focus-visible{outline:2px solid #75628c;outline-offset:0}
.gem[data-state="loading"]{cursor:progress}
.gem[data-state="error"] .disc{outline:1px dashed #75628c;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.disc{transition:none}}
</style>
</head>
<body>
<button type="button" class="gem" id="gem" data-state="idle" aria-label="Play recording" aria-pressed="false" title="Play recording"><span class="disc" aria-hidden="true"></span></button>
<script>
'use strict';
const button=document.getElementById('gem');
const audio=new Audio();audio.preload='none';
const clip=new URLSearchParams(location.search).get('clip')||'01';
let ready=null,starting=false;
function state(value){button.dataset.state=value;button.setAttribute('aria-pressed',String(value==='playing'));button.setAttribute('aria-busy',String(value==='loading'));const label=value==='playing'?'Pause recording':value==='error'?'Audio unavailable. Click to retry.':value==='loading'?'Loading recording':'Play recording';button.setAttribute('aria-label',label);button.title=label;}
async function prepare(){
 if(!/^\d{2}$/.test(clip))throw new Error('Invalid clip');
 const response=await fetch('./sound-bank-v1.json');
 if(!response.ok)throw new Error('Cannot load audio');
 const bank=await response.json();const source=bank[clip];
 if(typeof source!=='string'||!source.startsWith('data:audio/mpeg;base64,'))throw new Error('Unknown clip');
 audio.src=source;
}
function load(){if(!ready)ready=prepare().catch(error=>{ready=null;throw error});return ready;}
button.addEventListener('click',async()=>{
 if(starting)return;
 if(!audio.paused){audio.pause();return;}
 starting=true;state('loading');
 try{await load();if(audio.ended)audio.currentTime=0;await audio.play();}
 catch(error){state('error');}
 finally{starting=false;}
});
audio.addEventListener('playing',()=>state('playing'));
audio.addEventListener('waiting',()=>state('loading'));
audio.addEventListener('pause',()=>state('idle'));
audio.addEventListener('ended',()=>{audio.currentTime=0;state('idle')});
audio.addEventListener('error',()=>{ready=null;state('error')});
// Loading the source never starts playback. Only a deliberate click plays audio.
load().catch(()=>state('error'));
</script>
</body>
</html>
